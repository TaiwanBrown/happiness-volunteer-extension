<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <title>Quick Notes - Happiness Volunteer</title>
    <link rel="stylesheet" href="tools.css" />
  </head>
  <body>
    <div class="wrap">
      <div class="header">
        <h1>Quick Notes</h1>
        <button class="btn" id="backToTools">← Back to Tools</button>
      </div>

      <div class="notes-page-content">
        <div class="row">
          <input id="noteInput" type="text" placeholder="Add a new note..." />
          <button class="btn" id="addNote">Add</button>
        </div>
        <div id="notesList"></div>
        <div class="notes-footer">
          <button class="btn" id="exportNotesCSV">📥 Export Notes as CSV</button>
        </div>
      </div>
    </div>

    <script src="notes.js"></script>
  </body>
</html>
